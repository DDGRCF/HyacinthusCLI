# 改动说明：增加有来源快照的学校查询；保留21字段、联系方式与写前定位契约。
version: "2026-10-08"
backend_min_version: "0.1.0"
capabilities:
  - id: requirements.batch_parse
    title: 批量解析需求
    description: Agent 专用异步需求批量解析能力；CLI 自动轮询任务并返回最终候选记录，字段裁决仅由后端 errors 决定，warnings 永不阻断。
    domain: requirements
    command: hyacinthus requirements parse
    method: POST
    path: /api/v1/agent/requirements/batch-parse-jobs
    required_scopes:
      - requirements:parse
    risk_level: read
    supports_dry_run: cli
    supports_idempotency: false
    supports_pagination: false
    supports_file_upload: false
    min_backend_version: "0.1.0"
    introduced_in: "0.1.0"
    request_schema:
      type: object
      additionalProperties: false
      required:
        - raw_text
      properties:
        instance_id:
          type: integer
          minimum: 1
          description: 可选请求实例标识（i64 正整数）；授权身份由绑定 Agent token 确定，不用于选择授权用户。
        raw_text:
          type: string
          minLength: 1
          description: 待批量解析的原始需求文本。
        preset_contact_phone:
          type:
            - string
            - "null"
          description: 默认联系电话。
        preset_contact_wechat:
          type:
            - string
            - "null"
          description: 默认微信号。
        preset_city:
          type:
            - string
            - "null"
          description: 默认城市。
        mode:
          type: string
          enum:
            - strict
            - lenient
          default: lenient
          description: CSV/XLSX和标签文本按字段名及可识别别名映射到21字段整理规范，允许任意列数/顺序，缺失可选字段留空；未知/非编号重复字段聚合为非阻断 FIELD_RECOGNITION_NOTICE，重复编号为 error。默认 lenient，不调用 AI；CLI --file 只读取 UTF-8 TXT/CSV，不上传二进制 XLSX。
    response_schema:
      type: object
      required:
        - rows
        - summary
      properties:
        summary:
          type: object
          required:
            - auto_commit_ready
            - needs_confirmation
          properties:
            auto_commit_ready:
              type: integer
              description: 可自动提交的行数。
            needs_confirmation:
              type: integer
              description: 存在后端 errors、需要修正的行数。
        rows:
          type: array
          items:
            type: object
            required:
              - parsed
              - errors
              - can_auto_commit
              - needs_confirmation
              - confirmation_reasons
            properties:
              parsed:
                type: object
                description: 后端裁决的需求字段；geo_diagnostic 仅提供地理编码诊断，不阻断导入。
                properties:
                  geo_diagnostic:
                    type:
                      - object
                      - "null"
                    description: 地理编码诊断，包含 quality、confidence、warnings、reverse 等字段。
              warnings:
                type: array
                description: 非阻断解析警告；包括 GEO_* 地理编码诊断，不影响自动提交。
                items:
                  type: string
              errors:
                type: array
                description: 后端字段错误，唯一字段阻断来源。
                items:
                  type: string
              can_auto_commit:
                type: boolean
                description: 后端 errors 为空时为 true。
              needs_confirmation:
                type: boolean
                description: 后端 errors 非空时为 true。
              confirmation_reasons:
                type: array
                description: 等于后端 errors，不包含 warnings。
                items:
                  type: string
    examples:
      - title: 从文本文件解析需求
        command: hyacinthus requirements parse --file input.txt
      - title: 严格复核字段模板
        command: hyacinthus requirements parse --file input.txt --strict

  - id: requirements.batch_import
    title: 批量导入需求
    description: Agent 专用需求批量导入能力，创建或更新已确认需求，并返回逐批统计与失败行；CLI import-raw 会先解析并只导入后端 can_auto_commit 为 true 且 errors 为空的行，warnings 永不阻断。
    domain: requirements
    command: hyacinthus requirements import
    method: POST
    path: /api/v1/agent/requirements/batch-import
    required_scopes:
      - requirements:write
    risk_level: write
    supports_dry_run: cli
    supports_idempotency: true
    supports_pagination: false
    supports_file_upload: false
    min_backend_version: "0.1.0"
    introduced_in: "0.1.0"
    request_schema:
      type: object
      additionalProperties: false
      required:
        - confirmed_rows
        - idempotency_key
      properties:
        instance_id:
          type: integer
          minimum: 1
          description: 可选请求实例标识（i64 正整数）；授权身份由绑定 Agent token 确定，不用于选择授权用户。
        idempotency_key:
          type: string
          minLength: 1
          description: 调用方必填的稳定批次键，不允许空白或首尾空格；重试同一批导入必须复用，不自动生成或替换。
        confirmed_rows:
          type: array
          minItems: 1
          maxItems: 2000
          description: 待提交需求列表；后端最终裁决，warnings不阻断，确认标志不能绕过errors。
          items:
            type: object
            additionalProperties: false
            properties:
              requirement_type:
                type: string
                enum: [tutoring, consulting, resource_exchange, general]
                description: 需求类型，例如 tutoring。
              title:
                type: [string, "null"]
                description: 可选需求标题；留空不阻断。
              description:
                type: [string, "null"]
                description: 可选需求描述；缺省、null或空串均不阻断。
              raw_text:
                type:
                  - string
                  - "null"
                description: 需求原文。
              requirement_code:
                type:
                  - string
                  - "null"
                description: 必填外部需求编号；为空或原文出现两个编号时由后端报error，不自动生成。
              target_role_id:
                type:
                  - integer
                  - "null"
                description: 目标角色 ID；为空时表示通用目标角色。
              related_user_id:
                type:
                  - integer
                  - "null"
                description: 关联用户 ID，用于代他人发布场景。
              subject_ids:
                type: [array, "null"]
                items:
                  type: integer
                description: 科目 ID 列表。
              grade_ids:
                type: [array, "null"]
                items:
                  type: integer
                description: 年级 ID 列表。
              compensation:
                type:
                  - object
                  - "null"
                description: 薪资结构化对象。
                properties:
                  raw_text:
                    type:
                      - string
                      - "null"
                    description: 薪资原文。
                  amount_min:
                    type:
                      - string
                      - "null"
                    description: 最低金额。
                  amount_max:
                    type:
                      - string
                      - "null"
                    description: 最高金额。
                  currency:
                    type: string
                    description: 币种，默认 CNY。
                  billing_period:
                    type:
                      - string
                      - "null"
                    description: 计费周期，例如 hour、lesson。
                  billing_unit_text:
                    type:
                      - string
                      - "null"
                    description: 原始计费单位文本。
                  is_negotiable:
                    type: boolean
                    description: 是否可议价。
                  note:
                    type:
                      - string
                      - "null"
                    description: 薪资补充说明。
                  source:
                    type:
                      - string
                      - "null"
                    description: 字段来源。
                  confidence:
                    type:
                      - number
                      - "null"
                    description: 薪资独立业务元数据，不参与批量提交资格；不是已删除的批量解析置信度。
                  ext:
                    type:
                      - object
                      - "null"
                    description: 薪资扩展字段。
              condition:
                type:
                  - object
                  - "null"
                description: 需求方信息和老师要求条件对象。
                properties:
                  requester_role:
                    type:
                      - string
                      - "null"
                    description: 需求方角色，例如 家长、学生。
                  requester_gender:
                    type:
                      - string
                      - "null"
                    description: 与 requester_role 对应的需求方性别；家长发布时，学生性别保留在 description，不代填家长性别。
                  requester_education_level:
                    type:
                      - string
                      - "null"
                    description: 需求方学历。
                  requester_education_note:
                    type:
                      - string
                      - "null"
                    description: 需求方学历补充说明。
                  required_gender:
                    type:
                      - string
                      - "null"
                    description: 老师性别要求。
                  required_education_levels:
                    type: array
                    description: 老师学历要求，使用字符串数组。
                    items:
                      type: string
                  required_education_note:
                    type:
                      - string
                      - "null"
                    description: 老师学历补充说明。
                  required_school_names:
                    type: array
                    description: 老师学校要求，使用字符串数组。
                    items:
                      type: string
                  required_school_tiers:
                    type: array
                    description: 老师学校层次要求，使用字符串数组。
                    items:
                      type: string
                  required_school_ids:
                    type: array
                    description: 已确认的学校目录 ID 列表。
                    items:
                      type: integer
                  required_occupation:
                    type:
                      - string
                      - "null"
                    enum: [part_time_teacher, full_time_teacher, any, null]
                    description: 老师职业要求（兼职、全职或不限）；家教经验等文本条件写入 description，不作为职业枚举。
                  source:
                    type:
                      - string
                      - "null"
                    description: 字段来源。
                  confidence:
                    type:
                      - number
                      - "null"
                    description: 条件独立业务元数据，不参与批量提交资格；不是已删除的批量解析置信度。
                  ext:
                    type:
                      - object
                      - "null"
                    description: 条件扩展字段。
              preferred_mode:
                type: string
                enum:
                  - online
                  - offline
                  - hybrid
                description: 授课方式，默认 hybrid。
              weekly_frequency_min:
                type: [integer, "null"]
                minimum: 1
                maximum: 65535
              weekly_frequency_max:
                type: [integer, "null"]
                minimum: 1
                maximum: 65535
              session_duration_minutes_min:
                type: [integer, "null"]
                minimum: 1
                maximum: 65535
              session_duration_minutes_max:
                type: [integer, "null"]
                minimum: 1
                maximum: 65535
              class_time_text:
                type:
                  - string
                  - "null"
                description: 上课时间原文。
              address_detail:
                type:
                  - string
                  - "null"
                description: 上课地址详情。
              location:
                type:
                  - object
                  - "null"
                description: 坐标对象，使用 lng/lat。
                properties:
                  lng:
                    type: number
                  lat:
                    type: number
              tags:
                type:
                  - array
                  - "null"
                description: 需求标签列表。
                items:
                  type: string
              expires_at:
                type:
                  - string
                  - "null"
                format: date-time
                description: 过期时间；为空时后端使用默认过期时间。
              time_slots:
                type: array
                items:
                  type: object
                  properties:
                    weekday:
                      type: integer
                      minimum: 1
                      maximum: 7
                      description: 周几，1=周一，7=周日。
                    start_minute:
                      type: integer
                      minimum: 0
                      maximum: 1439
                      description: 当天开始分钟。
                    end_minute:
                      type: integer
                      minimum: 1
                      maximum: 1440
                      description: 当天结束分钟，必须大于 start_minute。
                    ext:
                      type:
                        - object
                        - "null"
                      description: 时段扩展字段。
                description: 可上课时间段；parse 结果为 null 时，CLI/Agent 复核导入前应转换为空数组。
              ext:
                type:
                  - object
                  - "null"
                description: 需求扩展字段；用户和管理员联系方式均放在此对象，管理员联系方式至少一项合法且非空，不由 confirmed import 凭空补出。保留解析所得 priority；后端补默认 priority 并写入已验证地理诊断。
                properties:
                  user_contact_phone:
                    type:
                      - string
                      - "null"
                    description: 用户联系方式电话（string|null）；为空静默，格式非法仅 warning（USER_CONTACT_PHONE_INVALID），不阻断提交。
                  user_contact_wechat:
                    type:
                      - string
                      - "null"
                    description: 用户联系方式微信（string|null）；为空静默，格式非法仅 warning（USER_CONTACT_WECHAT_INVALID），不阻断提交。
                  admin_contact_phone:
                    type:
                      - string
                      - "null"
                    description: 管理员电话；与 admin_contact_wechat 至少一项合法且非空，非法由后端报 ADMIN_CONTACT_PHONE_INVALID。
                  admin_contact_wechat:
                    type:
                      - string
                      - "null"
                    description: 管理员微信；与 admin_contact_phone 至少一项合法且非空，非法由后端报 ADMIN_CONTACT_WECHAT_INVALID。
    response_schema:
      type: object
      required:
        - created
        - updated
        - failed
        - created_ids
        - updated_ids
        - failed_rows
        - idempotency_key
        - idempotent_replay
      properties:
        created:
          type: integer
        updated:
          type: integer
        failed:
          type: integer
        created_ids:
          type: array
          items:
            type: integer
        updated_ids:
          type: array
          items:
            type: integer
        failed_rows:
          type: array
          items:
            type: object
        idempotency_key:
          type: string
          minLength: 1
        idempotent_replay:
          type: boolean
          description: true 表示后端返回的是同一幂等 key 的历史结果。
    examples:
      - title: 使用幂等 key 批量导入
        command: hyacinthus requirements import --file confirmed.json --idempotency-key cli-20260510-demo
      - title: 预览批量导入请求
        command: hyacinthus requirements import --file confirmed.json --idempotency-key cli-20260510-demo --dry-run

  - id: requirements.extend
    title: 延期需求
    description: 按需求编号刷新默认截止时间，恢复 open 并清除匹配；当前后端未使用请求 expires_at。
    domain: requirements
    command: hyacinthus requirements extend
    method: POST
    path: /api/v1/agent/requirements/extend
    required_scopes:
      - requirements:write
    risk_level: write
    supports_dry_run: cli
    supports_idempotency: false
    supports_pagination: false
    supports_file_upload: false
    min_backend_version: "0.1.0"
    introduced_in: "0.1.0"
    request_schema:
      type: object
      required:
        - requirement_code
      properties:
        instance_id:
          type:
            - integer
            - "null"
          minimum: 1
          description: 可选请求实例标识（i64 正整数）；授权身份由绑定 Agent token 确定，不用于选择授权用户。
        requirement_code:
          type: string
          minLength: 1
          maxLength: 64
          description: 需求编号。
        expires_at:
          type:
            - string
            - "null"
          format: date-time
          description: 接受 RFC 3339；CLI 未带时区按 +08:00 解释。当前后端未应用此值，实际使用默认有效期。
    response_schema:
      type: object
      required:
        - requirement_id
        - requirement_code
        - expires_at
      properties:
        requirement_id:
          type: integer
        requirement_code:
          type: string
        expires_at:
          type: string
          format: date-time
    examples:
      - title: 使用默认延期时间
        command: hyacinthus requirements extend KKH347 --yes

  - id: requirements.search
    title: 搜索需求
    description: Agent 专用需求关键字搜索能力，返回匹配总数和简表结果。
    domain: requirements
    command: hyacinthus requirements search
    method: GET
    path: /api/v1/agent/requirements/search
    required_scopes:
      - requirements:read
    risk_level: read
    supports_dry_run: false
    supports_idempotency: false
    supports_pagination: false
    supports_file_upload: false
    min_backend_version: "0.1.0"
    introduced_in: "0.1.0"
    request_schema:
      type: object
      required:
        - keyword
      properties:
        keyword:
          type: string
          minLength: 1
          description: 搜索关键字，匹配标题、编号、地址、描述、时间、用户、科目、年级和目标角色。
        scope:
          type: string
          enum:
            - active
            - all
            - invalid
            - expired
          description: 搜索范围；默认 active 表示当前有效需求。
        skip:
          type: integer
          minimum: 0
          description: 跳过的匹配记录数。
        limit:
          type: integer
          minimum: 1
          maximum: 100
          description: 返回的简表数量，后端最大 100。
    response_schema:
      type: object
      required:
        - total
        - items
        - skip
        - limit
        - has_more
        - scope
        - keyword
      properties:
        total:
          type: integer
          description: 匹配需求总数。
        items:
          type: array
          items:
            type: object
            required:
              - id
              - status
              - subject_names
              - grade_names
              - user_id
              - created_at
            properties:
              id:
                type: integer
              requirement_code:
                type:
                  - string
                  - "null"
              title:
                type:
                  - string
                  - "null"
              status:
                type: string
              subject_names:
                type: array
                items:
                  type: string
              grade_names:
                type: array
                items:
                  type: string
              address_detail:
                type:
                  - string
                  - "null"
              user_id:
                type: integer
              user_name:
                type:
                  - string
                  - "null"
              created_at:
                type: string
              expires_at:
                type:
                  - string
                  - "null"
        skip:
          type: integer
        limit:
          type: integer
        has_more:
          type: boolean
        scope:
          type: string
          enum:
            - active
            - all
            - invalid
            - expired
        keyword:
          type: string
    examples:
      - title: 搜索有效需求并返回数量
        command: hyacinthus requirements search --keyword 高一数学
      - title: 搜索已过期需求
        command: hyacinthus requirements search --keyword 高一数学 --scope expired

  - id: requirements.priority_rules.list
    title: 查询需求优先级规则
    description: Agent CLI 查询数据库中的需求编号优先级规则。
    domain: requirements
    command: hyacinthus requirements priority-rules list
    method: GET
    path: /api/v1/agent/requirements/priority-rules
    required_scopes:
      - requirements:priority_rules
    risk_level: read
    supports_dry_run: false
    supports_idempotency: false
    supports_pagination: false
    supports_file_upload: false
    min_backend_version: "0.1.0"
    introduced_in: "0.1.0"
    request_schema:
      type: object
      properties: {}
    response_schema:
      type: array
      items:
        type: object
        required:
          - id
          - pattern
          - priority
          - enabled
          - sort_order
          - created_at
          - updated_at
        properties:
          id:
            type: integer
          pattern:
            type: string
          priority:
            type: integer
          enabled:
            type: boolean
          description:
            type:
              - string
              - "null"
          sort_order:
            type: integer
          created_at:
            type: string
          updated_at:
            type: string
    examples:
      - title: 查询全部优先级规则
        command: hyacinthus requirements priority-rules list

  - id: requirements.priority_rules.create
    title: 创建需求优先级规则
    description: Agent CLI 创建数据库中的需求编号优先级规则。
    domain: requirements
    command: hyacinthus requirements priority-rules add
    method: POST
    path: /api/v1/agent/requirements/priority-rules
    required_scopes:
      - requirements:priority_rules
    risk_level: write
    supports_dry_run: cli
    supports_idempotency: false
    supports_pagination: false
    supports_file_upload: false
    min_backend_version: "0.1.0"
    introduced_in: "0.1.0"
    request_schema:
      type: object
      required:
        - pattern
        - priority
      properties:
        instance_id:
          type:
            - integer
            - "null"
          minimum: 1
        pattern:
          type: string
          minLength: 1
        priority:
          type: integer
          minimum: 1
        enabled:
          type: boolean
        description:
          type:
            - string
            - "null"
        sort_order:
          type:
            - integer
            - "null"
    response_schema:
      type: object
      required:
        - id
        - pattern
        - priority
        - enabled
        - sort_order
        - created_at
        - updated_at
      properties:
        id:
          type: integer
        pattern:
          type: string
        priority:
          type: integer
        enabled:
          type: boolean
        description:
          type:
            - string
            - "null"
        sort_order:
          type: integer
        created_at:
          type: string
        updated_at:
          type: string
    examples:
      - title: 创建 VIP 编号规则
        command: hyacinthus requirements priority-rules add --pattern '^VIP' --priority 10 --yes

  - id: requirements.priority_rules.update
    title: 更新需求优先级规则
    description: Agent CLI 更新数据库中的需求编号优先级规则。
    domain: requirements
    command: hyacinthus requirements priority-rules update
    method: PUT
    path: /api/v1/agent/requirements/priority-rules/update
    required_scopes:
      - requirements:priority_rules
    risk_level: write
    supports_dry_run: cli
    supports_idempotency: false
    supports_pagination: false
    supports_file_upload: false
    min_backend_version: "0.1.0"
    introduced_in: "0.1.0"
    request_schema:
      type: object
      required:
        - rule_id
      properties:
        rule_id:
          type: integer
          minimum: 1
        instance_id:
