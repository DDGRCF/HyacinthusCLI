  - id: catalog.reorder
    title: 科目/年级目录排序
    description: Agent 在用户确认后按指定 ID 顺序重排科目或年级目录。
    domain: catalog
    command: hyacinthus requirements catalog reorder
    method: PUT
    path: /api/v1/agent/catalog/reorder
    required_scopes:
      - catalog:write
    risk_level: write
    supports_dry_run: cli
    supports_idempotency: false
    supports_pagination: false
    supports_file_upload: false
    min_backend_version: "0.1.0"
    introduced_in: "0.1.0"
    deprecated: false
    request_schema:
      type: object
      required:
        - target
        - ordered_ids
      properties:
        target:
          type: string
          enum:
            - subjects
            - grades
        ordered_ids:
          type: array
          minItems: 1
          uniqueItems: true
          description: 必须覆盖目标目录当前全部 ID，且不能重复。
          items:
            type: integer
    response_schema:
      type: object
      required:
        - target
        - items
      properties:
        target:
          type: string
        items:
          type: array
          items:
            type: object
            required:
              - id
              - name
              - sort_order
              - is_active
              - action
            properties:
              id:
                type: integer
              name:
                type: string
              category:
                type:
                  - string
                  - "null"
              sort_order:
                type: integer
              is_active:
                type: boolean
              action:
                type: string
    examples:
      - title: 重排科目目录
        command: hyacinthus requirements catalog reorder --target subjects --ids 3,1,2 --yes
      - title: 重排年级目录
        command: hyacinthus requirements catalog reorder --target grades --ids 2,1,3 --yes

