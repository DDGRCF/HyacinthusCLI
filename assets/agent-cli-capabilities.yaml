    path: /api/v1/agent/requirements/priority-rules
    required_scopes:
      - requirements:priority_rules
    risk_level: read
    supports_dry_run: false
    supports_idempotency: false
    supports_pagination: false
    supports_file_upload: false
    min_backend_version: "0.1.0"
    introduced_in: "0.1.0"
    request_schema:
      type: object
      properties: {}
    response_schema:
      type: array
      items:
        type: object
        required:
          - id
          - pattern
          - priority
          - enabled
          - sort_order
          - created_at
          - updated_at
