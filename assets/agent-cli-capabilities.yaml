  - id: requirements.upload_run
    title: 创建或续读岗位上传运行单
    description: 最多100条的持久化写入通道；先解析地址或复用已有有效定位，再写入通过行，断线后以 client_run_id 续读相同结果。
    domain: requirements
    command: hyacinthus capability run requirements.upload_run
    method: POST
    path: /api/v1/agent/requirements/upload-runs
    required_scopes: [requirements:write]
    risk_level: write
    supports_dry_run: cli
    supports_idempotency: true
    supports_pagination: false
    supports_file_upload: false
    min_backend_version: "0.1.0"
    introduced_in: "0.1.0"
    request_schema:
      type: object
      additionalProperties: false
      required: [client_run_id, rows]
      properties:
        instance_id: {type: [integer, "null"], minimum: 1}
        client_run_id: {type: string, minLength: 1, maxLength: 160}
        rows:
          type: array
          minItems: 1
          maxItems: 100
          items:
            type: object
            additionalProperties: false
            required: [client_row_id, requirement]
            properties:
              client_row_id: {type: string, minLength: 1, maxLength: 160}
              revision_key: {type: [string, "null"], maxLength: 160}
              operation_key: {type: [string, "null"], maxLength: 200}
              requirement: {type: object}
    response_schema: &requirement_upload_run_response
      type: object
      required: [upload_run_id, client_run_id, status, stage, total, created, updated, extended, write_failed, geo_pending, geo_resolved, geo_needs_review, geo_unavailable, row_outcomes]
      properties:
        upload_run_id: {type: string}
        client_run_id: {type: string}
        status: {type: string}
        stage: {type: string}
        geo_run_id: {type: [string, "null"]}
        geocode_job_id: {type: [string, "null"]}
        total: {type: integer, minimum: 0}
        created: {type: integer, minimum: 0}
        updated: {type: integer, minimum: 0}
        extended: {type: integer, minimum: 0}
        write_failed: {type: integer, minimum: 0}
        geo_pending: {type: integer, minimum: 0}
        geo_resolved: {type: integer, minimum: 0}
        geo_needs_review: {type: integer, minimum: 0}
        geo_unavailable: {type: integer, minimum: 0}
        created_at: {type: string}
        updated_at: {type: string}
        completed_at: {type: [string, "null"]}
        row_outcomes:
          type: array
          items:
            type: object
            required: [row_id, row_index, client_row_id, write_status, geo_status, geocode_attempts]
            properties:
              row_id: {type: integer}
              row_index: {type: integer, minimum: 1}
              client_row_id: {type: string}
              requirement_code: {type: [string, "null"]}
              revision_key: {type: [string, "null"]}
              requirement_id: {type: [integer, "null"]}
              write_status: {type: string, enum: [pending, created, updated, extended, failed]}
              geo_status: {type: string, enum: [pending, resolved, needs_review, invalid, unavailable, not_required]}
              geo_reason: {type: [string, "null"]}
              city_boundary_pass: {type: [boolean, "null"]}
              geo_job_id: {type: [string, "null"]}
              geocode_attempts: {type: integer, minimum: 0}
              queue_wait_ms: {type: [integer, "null"], minimum: 0}
    examples:
      - title: 写入一批并取得运行单
        command: hyacinthus capability run requirements.upload_run --data @upload-run.json --yes

  - id: requirements.geocode_run
    title: 查询岗位地图运行单
