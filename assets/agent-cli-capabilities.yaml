# 改动说明：需求解析 schema 使用 strict/lenient 封闭模式并默认 strict。
version: "2026-09-04"
backend_min_version: "0.1.0"
capabilities:
  - id: requirements.batch_parse
    title: 批量解析需求
    description: Agent 专用异步需求批量解析能力；CLI 自动轮询任务并返回最终候选记录。
    domain: requirements
    command: hyacinthus requirements parse
    method: POST
    path: /api/v1/agent/requirements/batch-parse-jobs
    required_scopes:
      - requirements:parse
    risk_level: read
    supports_dry_run: cli
    supports_idempotency: false
    supports_pagination: false
    supports_file_upload: false
    min_backend_version: "0.1.0"
    introduced_in: "0.1.0"
    request_schema:
      type: object
      additionalProperties: false
      required:
        - raw_text
      properties:
        instance_id:
          type: integer
          minimum: 1
          description: Claw 实例 ID；静态 Agent key 调用时必填，session token 调用默认使用授权用户身份。
        raw_text:
          type: string
          minLength: 1
          description: 待批量解析的原始需求文本。
        preset_contact_phone:
          type:
            - string
            - "null"
          description: 默认联系电话。
        preset_contact_wechat:
          type:
            - string
            - "null"
          description: 默认微信号。
        preset_city:
          type:
            - string
            - "null"
          description: 默认城市。
        mode:
          type: string
          enum:
            - strict
            - lenient
          default: strict
          description: 解析模式；默认严格校验 format2，仅在显式指定 lenient 时允许字段别名和非标准顺序，不调用 AI。
    response_schema:
      type: object
      required:
        - rows
        - summary
      properties:
        summary:
          type: object
          required:
            - auto_commit_ready
            - needs_confirmation
          properties:
            auto_commit_ready:
              type: integer
              description: 可自动提交的行数。
            needs_confirmation:
              type: integer
              description: 需要人工确认的行数。
        rows:
          type: array
          items:
            type: object
            required:
              - can_auto_commit
              - needs_confirmation
              - confirmation_reasons
            properties:
              parsed:
                type: object
                description: 解析后的需求字段；低置信地理编码会在 geo_diagnostic 中返回质量、置信度和 GEO_* 警告。
                properties:
                  geo_diagnostic:
                    type:
                      - object
                      - "null"
                    description: 地理编码诊断，包含 quality、confidence、warnings、reverse 等字段。
              warnings:
                type: array
                description: 解析警告；地理编码低置信时包含 GEO_* 代码。
                items:
                  type: string
              errors:
                type: array
                items:
                  type: string
              confidence:
                type: number
              can_auto_commit:
                type: boolean
              needs_confirmation:
                type: boolean
              confirmation_reasons:
                type: array
                description: 需要确认的原因；地理编码低置信时包含 GEO_* 代码。
                items:
                  type: string
    examples:
      - title: 从文本文件解析需求
        command: hyacinthus requirements parse --file input.txt
      - title: 启用宽松字段匹配
        command: hyacinthus requirements parse --file input.txt --lenient

  - id: requirements.batch_import
    title: 批量导入需求
    description: Agent 专用需求批量导入能力，创建或更新已确认需求，并返回逐批统计与失败行；CLI import-raw 会先解析并只导入 can_auto_commit 且无需确认的行。
    domain: requirements
    command: hyacinthus requirements import
    method: POST
    path: /api/v1/agent/requirements/batch-import
    required_scopes:
      - requirements:write
    risk_level: write
    supports_dry_run: cli
    supports_idempotency: true
    supports_pagination: false
    supports_file_upload: false
    min_backend_version: "0.1.0"
    introduced_in: "0.1.0"
    request_schema:
      type: object
      additionalProperties: false
      required:
        - confirmed_rows
      properties:
        instance_id:
          type: integer
          minimum: 1
          description: Claw 实例 ID；静态 Agent key 调用时必填，session token 调用默认使用授权用户身份。
        idempotency_key:
          type:
            - string
            - "null"
          description: 批量导入幂等 key；重试同一批导入时必须复用。
        confirmed_rows:
          type: array
          minItems: 1
          maxItems: 2000
          description: 已确认可导入的需求创建 payload 列表。
          items:
            type: object
            additionalProperties: false
            required:
              - description
            properties:
              requirement_type:
                type: string
                description: 需求类型，例如 tutoring。
              title:
                type: string
                minLength: 1
                description: 需求标题。
              description:
                type: string
                minLength: 1
                description: 需求描述。
              raw_text:
                type:
                  - string
                  - "null"
                description: 需求原文。
              requirement_code:
                type:
                  - string
                  - "null"
                description: 外部需求编号；为空时由后端处理。
              target_role_id:
                type:
                  - integer
                  - "null"
                description: 目标角色 ID；为空时表示通用目标角色。
              related_user_id:
                type:
                  - integer
                  - "null"
                description: 关联用户 ID，用于代他人发布场景。
              subject_ids:
                type: array
                items:
                  type: integer
                description: 科目 ID 列表。
              grade_ids:
                type: array
                items:
                  type: integer
                description: 年级 ID 列表。
              compensation:
                type:
                  - object
                  - "null"
                description: 薪资结构化对象。
                properties:
                  raw_text:
                    type:
                      - string
                      - "null"
                    description: 薪资原文。
                  amount_min:
                    type:
                      - number
                      - "null"
                    description: 最低金额。
                  amount_max:
                    type:
                      - number
                      - "null"
                    description: 最高金额。
                  currency:
                    type: string
                    description: 币种，默认 CNY。
                  billing_period:
                    type:
                      - string
                      - "null"
                    description: 计费周期，例如 hour、lesson。
                  billing_unit_text:
                    type:
                      - string
                      - "null"
                    description: 原始计费单位文本。
                  is_negotiable:
                    type: boolean
                    description: 是否可议价。
                  note:
                    type:
                      - string
                      - "null"
                    description: 薪资补充说明。
                  source:
                    type:
                      - string
                      - "null"
                    description: 字段来源。
                  confidence:
                    type:
                      - number
                      - "null"
                    description: 解析置信度。
                  ext:
                    type:
                      - object
                      - "null"
                    description: 薪资扩展字段。
              condition:
                type:
                  - object
                  - "null"
                description: 需求方信息和老师要求条件对象。
                properties:
                  requester_role:
                    type:
                      - string
                      - "null"
                    description: 需求方角色，例如 家长、学生。
                  requester_gender:
                    type:
                      - string
                      - "null"
                    description: 需求方或学生性别。
                  requester_education_level:
                    type:
                      - string
                      - "null"
                    description: 需求方学历。
                  requester_education_note:
                    type:
                      - string
                      - "null"
                    description: 需求方学历补充说明。
                  required_gender:
                    type:
                      - string
                      - "null"
                    description: 老师性别要求。
                  required_education_levels:
                    type:
                      - array
                      - string
                      - "null"
                    description: 老师学历要求，可为数组或原始字符串。
                    items:
                      type: string
                  required_education_note:
                    type:
                      - string
                      - "null"
                    description: 老师学历补充说明。
                  required_school_names:
                    type:
                      - array
                      - string
                      - "null"
                    description: 老师学校要求，可为数组或原始字符串。
                    items:
                      type: string
                  required_school_tiers:
                    type:
                      - array
                      - string
                      - "null"
                    description: 老师学校层次要求，可为数组或原始字符串。
                    items:
                      type: string
                  required_school_ids:
                    type:
                      - array
                      - "null"
                    description: 已确认的学校目录 ID 列表。
                    items:
                      type: integer
                  required_occupation:
                    type:
                      - string
                      - "null"
                    description: 老师资格或职业要求。
                  source:
                    type:
                      - string
                      - "null"
                    description: 字段来源。
                  confidence:
                    type:
                      - number
                      - "null"
                    description: 解析置信度。
                  ext:
                    type:
                      - object
                      - "null"
                    description: 条件扩展字段。
              preferred_mode:
                type: string
                enum:
                  - online
                  - offline
                  - hybrid
                description: 授课方式，默认 hybrid。
              class_time_text:
                type:
                  - string
                  - "null"
                description: 上课时间原文。
              address_detail:
                type:
                  - string
                  - "null"
                description: 上课地址详情。
              location:
                type:
                  - object
                  - "null"
                description: 坐标对象，使用 lng/lat。
                properties:
                  lng:
                    type: number
                  lat:
                    type: number
              tags:
                type:
                  - array
                  - "null"
                description: 需求标签列表。
                items:
                  type: string
              expires_at:
                type:
                  - string
                  - "null"
                format: date-time
                description: 过期时间；为空时后端使用默认过期时间。
              time_slots:
                type: array
                items:
                  type: object
                  properties:
                    weekday:
                      type: integer
                      minimum: 1
                      maximum: 7
                      description: 周几，1=周一，7=周日。
                    start_minute:
                      type: integer
                      minimum: 0
                      maximum: 1439
                      description: 当天开始分钟。
                    end_minute:
                      type: integer
                      minimum: 1
                      maximum: 1440
                      description: 当天结束分钟，必须大于 start_minute。
                    ext:
                      type:
                        - object
                        - "null"
                      description: 时段扩展字段。
                description: 可上课时间段；parse 结果为 null 时，CLI/Agent 复核导入前应转换为空数组。
              ext:
                type:
                  - object
                  - "null"
                description: 需求扩展字段；Agent 导入会补默认 priority/admin contact，并写入压缩后的 geo_diagnostic 与 geo_location_source。
    response_schema:
      type: object
      required:
        - created
        - updated
        - failed
        - created_ids
        - updated_ids
        - failed_rows
      properties:
        created:
          type: integer
        updated:
          type: integer
        failed:
          type: integer
        created_ids:
          type: array
          items:
            type: integer
        updated_ids:
          type: array
          items:
            type: integer
        failed_rows:
          type: array
          items:
            type: object
        idempotency_key:
          type: string
        idempotent_replay:
          type: boolean
          description: true 表示后端返回的是同一幂等 key 的历史结果。
    examples:
      - title: 使用幂等 key 批量导入
        command: hyacinthus requirements import --file confirmed.json --idempotency-key cli-20260510-demo
      - title: 预览批量导入请求
        command: hyacinthus requirements import --file confirmed.json --idempotency-key cli-20260510-demo --dry-run

  - id: requirements.extend
    title: 延期需求
    description: Agent 专用需求延期能力，按需求编号刷新默认截止时间或设置指定截止时间。
    domain: requirements
    command: hyacinthus requirements extend
    method: POST
    path: /api/v1/agent/requirements/extend
    required_scopes:
      - requirements:write
    risk_level: write
    supports_dry_run: cli
    supports_idempotency: false
    supports_pagination: false
    supports_file_upload: false
    min_backend_version: "0.1.0"
    introduced_in: "0.1.0"
    request_schema:
      type: object
      required:
        - requirement_code
      properties:
        instance_id:
          type:
            - integer
            - "null"
          minimum: 1
          description: Claw 实例 ID；静态 Agent key 调用时必填，session token 调用默认使用授权用户身份。
        requirement_code:
          type: string
          minLength: 1
          maxLength: 64
          description: 需求编号。
        expires_at:
          type:
            - string
            - "null"
          format: date-time
          description: 手动指定延期到的时间；为空时使用系统默认延期时间。
    response_schema:
      type: object
      required:
        - requirement_id
        - requirement_code
        - expires_at
      properties:
        requirement_id:
          type: integer
        requirement_code:
          type: string
        expires_at:
          type: string
          format: date-time
    examples:
      - title: 使用默认延期时间
        command: hyacinthus requirements extend KKH347 --yes
      - title: 手动设置延期到指定时间
        command: hyacinthus requirements extend KKH347 --expires-at 2026-07-10T12:00:00 --yes

  - id: requirements.search
    title: 搜索需求
    description: Agent 专用需求关键字搜索能力，返回匹配总数和简表结果。
    domain: requirements
    command: hyacinthus requirements search
    method: GET
    path: /api/v1/agent/requirements/search
    required_scopes:
      - requirements:read
    risk_level: read
    supports_dry_run: false
    supports_idempotency: false
    supports_pagination: false
    supports_file_upload: false
    min_backend_version: "0.1.0"
    introduced_in: "0.1.0"
    request_schema:
      type: object
      required:
        - keyword
      properties:
        keyword:
          type: string
          minLength: 1
          description: 搜索关键字，匹配标题、编号、地址、描述、时间、用户、科目、年级和目标角色。
        scope:
          type: string
          enum:
            - active
            - all
            - invalid
            - expired
          description: 搜索范围；默认 active 表示当前有效需求。
        skip:
          type: integer
          minimum: 0
          description: 跳过的匹配记录数。
        limit:
          type: integer
          minimum: 1
          description: 返回的简表数量，后端最大 100。
    response_schema:
      type: object
      required:
        - total
        - items
        - skip
        - limit
        - has_more
        - scope
        - keyword
      properties:
        total:
          type: integer
          description: 匹配需求总数。
        items:
          type: array
          items:
            type: object
            required:
              - id
              - status
              - subject_names
              - grade_names
              - user_id
              - created_at
            properties:
              id:
                type: integer
              requirement_code:
                type:
                  - string
                  - "null"
              title:
                type:
                  - string
                  - "null"
              status:
                type: string
              subject_names:
                type: array
                items:
                  type: string
              grade_names:
                type: array
                items:
                  type: string
              address_detail:
                type:
                  - string
                  - "null"
              user_id:
                type: integer
              user_name:
                type:
                  - string
                  - "null"
              created_at:
                type: string
              expires_at:
                type:
                  - string
                  - "null"
        skip:
          type: integer
        limit:
          type: integer
        has_more:
          type: boolean
        scope:
          type: string
          enum:
            - active
            - all
            - invalid
            - expired
        keyword:
          type: string
    examples:
      - title: 搜索有效需求并返回数量
        command: hyacinthus requirements search --keyword 高一数学
      - title: 搜索已过期需求
        command: hyacinthus requirements search --keyword 高一数学 --scope expired

  - id: requirements.priority_rules.list
