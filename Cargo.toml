[package]
name = "hyacinthus"
version = "0.1.4"
edition = "2021"
description = "Agent-oriented CLI for Hyacinthus backend operations"
license = "MIT"
repository = "https://github.com/DDGRCF/HyacinthusCLI"

[dependencies]
anyhow = "1.0"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive"] }
clap_complete = "4.5"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls-native-roots"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
uuid = { version = "1.11", features = ["v4"] }

[dev-dependencies]
tempfile = "3.13"
